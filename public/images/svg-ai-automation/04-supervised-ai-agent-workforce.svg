<rect x="1108" y="562" width="42" height="42" rx="13" class="iconFill2"/>
<circle cx="1129" cy="583" r="9" fill="none" stroke="var(--blue2)" stroke-width="2"/><path d="M1121 583h16M1129 575v16" class="iconStroke"/>
