      <path d="M-4 -48 C-28 -67 -51 -48 -48 -25 C-69 -9 -59 21 -39 25 C-39 47 -16 55 -1 39"/>
      <path d="M4 -48 C28 -67 51 -48 48 -25 C69 -9 59 21 39 25 C39 47 16 55 1 39"/>
      <path d="M0 -48V42 M-38 -20H-17L-8 -7 M38 -20H17L8 -7 M-39 17H-18L-7 7 M39 17H18L7 7"/>
      <circle cx="-17" cy="-20" r="4" fill="#9ae72b" stroke="none"/><circle cx="17" cy="-20" r="4" fill="#6be2f2" stroke="none"/>
      <circle cx="-18" cy="17" r="4" fill="#6be2f2" stroke="none"/><circle cx="18" cy="17" r="4" fill="#9ae72b" stroke="none"/>
      <circle cx="0" cy="-4" r="5" fill="#ffffff" stroke="none"/>
    </g>
<text x="800" y="520" text-anchor="middle" class="hubText">AGENT ORCHESTRATOR</text>
<text x="800" y="548" text-anchor="middle" class="hubSub">Plan · Delegate · Check · Escalate</text>
<rect x="704" y="565" width="192" height="24" rx="12" fill="#ffffff" opacity=".17"/><text x="800" y="582" text-anchor="middle" fill="#fff" font-size="10.5" font-weight="800" letter-spacing="1">POLICY-AWARE CONTROL</text>
<g filter="url(#softShadow)"><rect x="130" y="292" width="330" height="156" rx="19" class="card"/></g>
<rect x="148" y="309" width="42" height="42" rx="13" class="iconFill2"/>
<circle cx="169" cy="330" r="9" fill="none" stroke="var(--blue2)" stroke-width="2"/><path d="M161 330h16M169 322v16" class="iconStroke"/>
<text x="206" y="334" class="tiny">SALES AGENT</text>
<text x="150" y="380" class="body" font-weight="700">Qualify leads · Prepare follow-ups</text>
