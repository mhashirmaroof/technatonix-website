<path d="M800 476 L350 370 M800 476 L1250 370 M800 476 L350 620 M800 476 L1250 620 M800 476 L800 690" class="connector"/>
<path d="M800 476 L350 370 M800 476 L1250 370 M800 476 L350 620 M800 476 L1250 620 M800 476 L800 690" class="flow"/>
<g filter="url(#softShadow)"><rect x="610" y="352" width="380" height="250" rx="26" class="hubCore"/></g>
<circle cx="800" cy="426" r="57" fill="#ffffff" opacity=".10"/><circle cx="800" cy="426" r="49" fill="none" stroke="#d6f7ff" stroke-opacity=".65"/>
