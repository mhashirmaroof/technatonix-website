<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="tnx-integrations-title tnx-integrations-desc">
<title id="tnx-integrations-title">The Technatonix — Connected Business Systems and Enterprise Integration</title>
<desc id="tnx-integrations-desc">An integration architecture showing existing business applications such as CRM, ERP, finance, HR, e-commerce, customer support, databases, documents, email and calendar connected through an API and event integration layer to AI-assisted workflows and coordinated business outcomes.</desc>
<defs>
  <linearGradient id="hubGradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1649d8"/><stop offset=".55" stop-color="#087fcd"/><stop offset="1" stop-color="#05a8c8"/></linearGradient>
  <linearGradient id="blueGradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#164de5"/><stop offset="1" stop-color="#12b9e2"/></linearGradient>
  <radialGradient id="hubGlow"><stop offset="0" stop-color="#1c86ee" stop-opacity=".23"/><stop offset="1" stop-color="#1c86ee" stop-opacity="0"/></radialGradient>
  <filter id="softShadow" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="var(--shadow)" flood-opacity=".13"/></filter>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="dotGrid" width="34" height="34" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="var(--grid)" opacity=".72"/></pattern>
</defs>
<style>
:root {
  color-scheme: light dark;
  --bg: #f5f8ff;
  --bg2: #edf3ff;
  --surface: #ffffff;
  --surface2: #edf4ff;
  --surface3: #e4efff;
  --text: #101c35;
  --muted: #586985;
  --soft: #7c8ba5;
  --line: #d6e2f3;
  --grid: #dce7f6;
  --blue: #174de5;
  --blue2: #167eea;
  --cyan: #09a9d2;
  --lime: #78d900;
  --violet: #7457e8;
  --green: #17a77a;
  --shadow: #1e3b70;
  --darkText: #f4f8ff;
  --darkMuted: #bac9df;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #071329;
    --bg2: #0a1b36;
    --surface: #10213d;
    --surface2: #142a4b;
    --surface3: #19365d;
    --text: #f3f7ff;
    --muted: #b2c2dc;
    --soft: #8ea3c2;
    --line: #294568;
    --grid: #16304f;
    --blue: #79aaff;
    --blue2: #3e9aff;
    --cyan: #53d5ee;
    --lime: #9ae72b;
    --violet: #a99aff;
    --green: #54d8ad;
    --shadow: #000814;
    --darkText: #f5f8ff;
    --darkMuted: #b9c8df;
  }
}
text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
.bg { fill: var(--bg); }
.bg2 { fill: var(--bg2); }
.gridLine { stroke: var(--grid); stroke-width: 1; opacity: .72; }
.eyebrow { fill: var(--blue2); font-size: 15px; font-weight: 800; letter-spacing: 2.4px; }
.heading { fill: var(--text); font-size: 48px; font-weight: 780; letter-spacing: -1.8px; }
.subheading { fill: var(--muted); font-size: 19px; font-weight: 450; }
.card { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; }
.cardSoft { fill: var(--surface2); stroke: var(--line); stroke-width: 1.2; }
.cardStrong { fill: var(--surface3); stroke: var(--line); stroke-width: 1.3; }
.cardTitle { fill: var(--text); font-size: 19px; font-weight: 760; }
.outputTitle { fill: var(--text); font-size: 13px; font-weight: 760; letter-spacing: -.15px; }
.outputDesc { fill: var(--muted); font-size: 11.5px; font-weight: 550; }
.body { fill: var(--muted); font-size: 15px; font-weight: 500; }
.small { fill: var(--muted); font-size: 13px; font-weight: 550; }
.tiny { fill: var(--soft); font-size: 11px; font-weight: 750; letter-spacing: 1.4px; }
.brand { fill: var(--text); font-size: 13px; font-weight: 850; letter-spacing: 2px; }
.pill { fill: var(--surface2); stroke: var(--line); stroke-width: 1; }
.pillText { fill: var(--muted); font-size: 12px; font-weight: 650; }
.iconStroke { fill: none; stroke: var(--blue2); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.iconAccent { fill: none; stroke: var(--lime); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.iconFill { fill: var(--blue2); }
.iconFill2 { fill: var(--surface3); stroke: var(--line); stroke-width: 1; }
.connector { fill: none; stroke: var(--blue2); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; opacity: .62; }
.connectorAlt { fill: none; stroke: var(--cyan); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; opacity: .58; }
.flow { fill: none; stroke: var(--cyan); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 8 12; animation: flow 2.1s linear infinite; }
.flowBlue { fill: none; stroke: var(--blue2); stroke-width: 2.6; stroke-linecap: round; stroke-dasharray: 6 11; animation: flow 2.6s linear infinite; }
.flowLime { fill: none; stroke: var(--lime); stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 4 10; animation: flow 2.2s linear infinite; }
.nodePulse { animation: pulse 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.floatA { animation: float 4.2s ease-in-out infinite; }
.floatB { animation: float 5s ease-in-out -1.2s infinite; }
.hubCore { fill: url(#hubGradient); stroke: var(--blue2); stroke-width: 2; }
.hubText { fill: #ffffff; font-size: 22px; font-weight: 850; letter-spacing: .5px; }
.hubSub { fill: #d7eaff; font-size: 13px; font-weight: 600; }
.badgeBlue { fill: var(--blue); }
.badgeGreen { fill: var(--lime); }
.badgeTextLight { fill: #ffffff; font-size: 11px; font-weight: 800; letter-spacing: 1px; }
.orbit { fill: none; stroke: var(--blue2); stroke-width: 1.5; opacity: .22; stroke-dasharray: 5 10; }
.separator { stroke: var(--line); stroke-width: 1.2; }
@keyframes flow { to { stroke-dashoffset: -80; } }
@keyframes pulse { 0%,100% { opacity: .68; transform: scale(.96); } 50% { opacity: 1; transform: scale(1.06); } }
@keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
@media (prefers-reduced-motion: reduce) {
  .flow, .flowBlue, .flowLime, .nodePulse, .floatA, .floatB { animation: none !important; }
}
</style>
<rect width="1600" height="900" class="bg"/>
<rect width="1600" height="900" fill="url(#dotGrid)" opacity=".52"/>
<g transform="translate(72 58)">
